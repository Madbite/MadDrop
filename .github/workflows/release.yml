name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows-build]"

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the app and installer
        shell: pwsh
        run: .\scripts\build_windows.ps1

      - name: Add the stable download filename
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist\installer\MadDrop-Setup-*.exe" |
            Where-Object { $_.Name -ne "MadDrop-Setup.exe" } |
            Select-Object -First 1
          if (-not $installer) { throw "No installer was produced." }
          Copy-Item $installer.FullName "dist\installer\MadDrop-Setup.exe"
          Write-Host "Built $($installer.Name)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MadDrop-Windows
          path: dist/installer/*.exe
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          # Match every installer, including the stable MadDrop-Setup.exe copy:
          # the pattern "MadDrop-Setup-*.exe" needs a dash and would skip it.
          $files = @(Get-ChildItem "dist\installer\*.exe" | Select-Object -ExpandProperty FullName)
          $files | ForEach-Object { Write-Host "Uploading $_" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "MadDrop $tag" --generate-notes
          }
